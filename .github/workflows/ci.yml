name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify site entry points exist
        run: |
          test -f index.html && test -f affiliate.html && test -f affiliate-portal.html && test -f admin-affiliates.html && test -f affiliate.js && echo "entry points OK"

      - name: Verify Worker syntax
        run: |
          node --check worker/src/index.js && node --check worker/src/affiliate.js && test -f worker/wrangler.toml && echo "worker OK"

      - name: Run tests
        run: npm test

      - name: Ensure no real secrets committed
        run: |
          ! grep -RIn -E 'AIzaSy[0-9A-Za-z_-]{20,}|AQ\.Ab[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{20,}|pdl_[a-z]+_[0-9A-Za-z]+|re_[0-9A-Za-z]{20,}|0x[0-9a-fA-F]{64}'             --exclude='.env.example' --exclude-dir='.git' --exclude-dir='node_modules' --exclude-dir='dist' --exclude='firebase-applet-config.json'             . && echo "no hardcoded secrets found" || { echo "potential secret committed"; exit 1; }
