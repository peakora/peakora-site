name: Deploy Worker + Secrets

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy Worker code
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      # Apply D1 schema (CREATE TABLE IF NOT EXISTS -> idempotent & safe on every deploy).
      # Creates/refreshes the affiliate engine tables so the program is live.
      - name: Apply D1 schema
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute peakora-db --remote --file=schema.sql
        continue-on-error: true

      # Set / refresh Worker secrets from GitHub repo secrets.
      # continue-on-error so a missing secret doesn't block the code deploy.
      - name: Set DODO_PAYMENTS_WEBHOOK_SECRET
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.DODO_PAYMENTS_WEBHOOK_SECRET }}
        continue-on-error: true
        run: printf '%s' "$SECRET_VALUE" | wrangler secret put DODO_PAYMENTS_WEBHOOK_SECRET

      - name: Set ADMIN_TOKEN
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.ADMIN_TOKEN }}
        continue-on-error: true
        run: printf '%s' "$SECRET_VALUE" | wrangler secret put ADMIN_TOKEN

      - name: Set DODO_PAYMENTS_LIVE_API_KEY
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.DODO_PAYMENTS_LIVE_API_KEY }}
        continue-on-error: true
        run: printf '%s' "$SECRET_VALUE" | wrangler secret put DODO_PAYMENTS_LIVE_API_KEY
